<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Avatar Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffe7f0, #e0f7fa);
            color: #334155;
            font-family: 'Segoe UI', sans-serif;
        }
        h1, h3 {
            color: #334155;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .image-container {
            margin: 20px 0;
            text-align: center;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .webcam-container {
            position: relative;
            width: 100%;
        }
        #webcam {
            width: 100%;
            border-radius: 8px;
        }
        #capture-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .filter-options {
            margin: 20px 0;
        }
        .btn-primary {
            background-color: #ec4899;
            border-color: #ec4899;
        }
        .btn-primary:hover {
            background-color: #db2777;
            border-color: #db2777;
        }
        .btn-success {
            background-color: #38bdf8;
            border-color: #38bdf8;
        }
        .btn-success:hover {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">AI Avatar Generator</h1>
        <p class="text-center mb-4">Generate anime-style avatars with fun filters. Upload images or use your webcam to see live previews and capture your filtered avatar.</p>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Upload Image</h5>
                        <form id="upload-form">
                            <div class="mb-3">
                                <input type="file" class="form-control" id="image-upload" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Process Image</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Use Webcam</h5>
                        <div class="webcam-container">
                            <video id="webcam" autoplay playsinline></video>
                            <button id="capture-btn" class="btn btn-primary">Capture</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-options text-center">
            <select class="form-select" id="filter-select">
                <option value="Avatar">Avatar</option>
                <option value="Robot">Robot</option>
                <option value="Sunglasses">Sunglasses</option>
                <option value="Thug Life">Thug Life</option>
                <option value="SpiderMan">SpiderMan</option>
                <option value="Alien">Alien</option>
                <option value="B/W">Black & White</option>
            </select>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="image-container">
                    <h3>Original Image</h3>
                    <img id="original-image" src="" alt="Original Image" style="display: none;">
                </div>
            </div>
            <div class="col-md-6">
                <div class="image-container">
                    <h3>Processed Image</h3>
                    <img id="processed-image" src="" alt="Processed Image" style="display: none;">
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <button id="download-btn" class="btn btn-success" style="display: none;">Download Processed Image</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const filterSelect = document.getElementById('filter-select');
        const uploadForm = document.getElementById('upload-form');
        const originalImage = document.getElementById('original-image');
        const processedImage = document.getElementById('processed-image');
        const downloadBtn = document.getElementById('download-btn');

        let lastImageData = null;
        let sourceType = null;

        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error('Error accessing webcam:', err);
            }
        }

        captureBtn.addEventListener('click', async () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/png').split(',')[1];

            lastImageData = imageData;
            sourceType = 'webcam';

            await processImageWithFilter();
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('image-upload');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select an image file');
                return;
            }

            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64Image = reader.result.split(',')[1];
                lastImageData = base64Image;
                sourceType = 'upload';

                await processImageWithFilter();
            };
            reader.readAsDataURL(file);
        });

        filterSelect.addEventListener('change', async () => {
            if (lastImageData) {
                await processImageWithFilter();
            }
        });

        async function processImageWithFilter() {
            const endpoint = sourceType === 'webcam' ? '/process_webcam' : '/process_image';
            const bodyData = sourceType === 'webcam'
                ? JSON.stringify({ image: 'data:image/png;base64,' + lastImageData, filter_option: filterSelect.value })
                : new FormData();

            if (sourceType === 'upload') {
                const blob = b64toBlob(lastImageData, 'image/png');
                bodyData.append('file', blob, 'upload.png');
                bodyData.append('filter_option', filterSelect.value);
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: sourceType === 'webcam' ? { 'Content-Type': 'application/json' } : undefined,
                    body: bodyData
                });

                const data = await response.json();

                if (sourceType === 'webcam') {
                    originalImage.src = 'data:image/png;base64,' + lastImageData;
                    originalImage.style.display = 'block';
                } else if (data.original_image) {
                    originalImage.src = 'data:image/png;base64,' + data.original_image;
                    originalImage.style.display = 'block';
                }

                if (data.processed_image) {
                    const processedBase64 = data.processed_image;
                    processedImage.src = 'data:image/png;base64,' + processedBase64;
                    processedImage.style.display = 'block';

                    downloadBtn.style.display = 'inline-block';
                    downloadBtn.onclick = () => downloadImage(processedBase64, 'avatar_filtered.png');
                }
            } catch (error) {
                console.error('Error processing image:', error);
            }
        }

        function downloadImage(base64Data, filename) {
            const link = document.createElement('a');
            link.href = 'data:image/png;base64,' + base64Data;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
            const byteCharacters = atob(b64Data);
            const byteArrays = [];

            for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                const slice = byteCharacters.slice(offset, offset + sliceSize);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }

            return new Blob(byteArrays, { type: contentType });
        }

        initWebcam();
    </script>
</body>
</html>
